<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>슬레이어즈 붉은 마도사전</title><link rel=icon href="data:,"><link rel=stylesheet href=style.css><style>#boot{position:fixed;inset:0;z-index:99999;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#3a0f12 0,#16070c 55%,#07030a 100%);transition:opacity .35s ease;font-family:Maplestory,"Noto Sans KR",sans-serif}
#boot.out{opacity:0}#boot .bt{font:900 30px/1.15 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;text-align:center;letter-spacing:1px;background:linear-gradient(#fff4c8,#ffb02e 60%,#d0541a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a0d06) drop-shadow(0 0 10px #ff5a2a66)}
#boot .bs{margin-top:6px;font:700 12px "Noto Sans KR",sans-serif;color:#e8c890;letter-spacing:4px;opacity:.85}
#boot .orb{width:58px;height:58px;margin:0 0 18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6c0 0,#ff9a2a 30%,#c2280e 62%,#3a0806 100%);box-shadow:0 0 22px #ff6a2a99,0 0 60px #ff3a1a44;animation:bto 1.6s ease-in-out infinite}
@keyframes bto{50%{transform:scale(1.08);box-shadow:0 0 30px #ff8a3acc,0 0 80px #ff3a1a66}}
#boot .bb{margin-top:34px;width:200px;height:8px;border-radius:5px;background:#1a0a08;border:1px solid #8a5a2a;box-shadow:inset 0 1px 2px #000;overflow:hidden}#boot .bb{position:relative}#boot .bb::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0000 0,#ffd27a55 50%,#0000 100%);background-size:60px 100%;background-repeat:no-repeat;animation:bts 1.2s linear infinite}@keyframes bts{from{background-position:-60px 0}to{background-position:200px 0}}#boot .bb i{display:block;height:100%;width:3%;border-radius:4px;background:linear-gradient(#ffe08a,#e07a1a);transition:width .25s}
#boot .bp{margin-top:8px;font:700 11px "Noto Sans KR",sans-serif;color:#c9a46a}/* r482 boot like 화룡전 title: bright sky key-art bg, SD Lina hero, Maplestory logo w/ dark outline, bar on a dark plate. Display only */
#boot{background:url(assets/bg_clear.jpg) center/cover,#f3e6d0!important;justify-content:flex-end!important;padding-bottom:150px}
#boot::before{content:'';position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(#0000,#1a0c2a88 55%,#140a20cc);pointer-events:none}
#boot>*{position:relative}
#boot .orb{width:150px;height:232px;margin:0 0 4px;border-radius:0;background:url(assets/sd_lina.png) center bottom/contain no-repeat;box-shadow:none;filter:drop-shadow(0 6px 6px #0006);animation:btl 2.4s ease-in-out infinite}
@keyframes btl{50%{transform:translateY(-6px)}}
#boot .bt{font:900 36px/1.1 Maplestory,"Noto Sans KR",sans-serif!important;filter:drop-shadow(0 2px 0 #4a0d06) drop-shadow(0 0 2px #4a0d06) drop-shadow(0 3px 4px #0008)!important}
#boot .bs{font:700 12px Maplestory,sans-serif!important;color:#fff3d6!important;opacity:1!important;text-shadow:0 1px 0 #000,0 0 4px #000}
#boot .bp{font:700 12px Maplestory,sans-serif!important;color:#ffe8b8!important;text-shadow:0 1px 0 #000}
#boot .bb{margin-top:20px!important}
</style></head><body><div id=boot><div class=orb></div><div class=bt>슬레이어즈<br>붉은 마도사전</div><div class=bs>RED SORCERESS CHRONICLE</div><div class=bb><i></i></div><div class=bp>마력을 모으는 중… 0%</div></div>
<div id=app>
 <div id=battle><canvas id=cv width=390 height=844></canvas>
  <div class=hud><div class=prof id=prof><div class=av><img src=assets/hero_lina.png></div><div class=pinfo><b id=hName>Lv.1</b><small id=hPow>0</small><div class=xpbar><i id=xpBar></i></div></div></div><div class=cur><span id=cGold>0</span><span id=cGem>0</span><span id=menuBtn class=menubtn>▼</span></div></div>
  <div class=stagebar id=stagebar><b id=stName>[일반] 1-1</b><div class=srow><i class=snode></i><div class=bar><i id=stBar></i></div><img class=sboss src=assets/boss_demon.png></div><div class=trow><span><img class=hi src=assets/ui_timer.png width=9 height=14 alt=""></span><div class=bar><i id=tBar></i></div><small id=stInfo></small></div></div>
  <div class=bossrow><span id=bossBtn class=bossbtn><i>ϟ</i></span><span id=autoBoss class=autob>자동</span><span id=facTag class=factag></span></div>
  <div class="side left" id=sideL></div><div class="side right" id=sideR></div><div class="side rlow" id=sideR2></div><div class="side sfold" id=sideF></div>

  <div class=idle id=idleBtn><img src=assets/ic3_chest.png><b>방치보상</b><small id=idleT></small></div>
  <div class=mission id=mission></div>
  <div class=skills id=skills></div>
  <div class=chat id=chat><img class=cb src=assets/ic3_chat.png><span id=chatT></span></div>
 </div>
 <div id=sheet><div class=sheethead><b id=sheetTitle></b><span class=xbtn id=sheetClose>✕</span></div><div id=panel></div></div>
 <div id=screen></div><div id=menuPop><div class=mbox><div class=sheethead><b>메뉴</b><span class=xbtn id=menuClose>✕</span></div><div class=mgrid id=mgrid></div></div></div>
 <nav class=nav id=nav></nav>
</div>
<script src=webp.js></script><script src=data.js></script><script src=core.js></script><script src=render.js></script><script src=game.js></script><script>/* r234 UX: boot splash until the battle field and HUD art are ready (visual only, never blocks input) */
(()=>{const bt=document.getElementById('boot');if(!bt)return;const t0=performance.now(),bar=bt.querySelector('.bb i'),tx=bt.querySelector('.bp');const KEY=['hud_plate.png','nav_bar.png','dock_frame.png','dock_mission.png','hero_lina.png'].map(n=>{const i=new Image();i.src='assets/'+n;return i});let done=0,shown=0;
const tick=()=>{if(done)return;const ims=[...document.querySelectorAll('#app img')].filter(i=>i.offsetParent);const all=KEY.concat(ims);const ok=all.filter(i=>i.complete).length;const R=window.RENDER,bg=!!(R&&R.bgCache&&Object.keys(R.bgCache).length);const pr=Math.min(1,(ok/Math.max(1,all.length))*.8+(bg?.2:0));if(pr>shown)shown=pr;bar.style.width=Math.max(3,Math.round(shown*100))+'%';tx.textContent='마력을 모으는 중… '+Math.round(shown*100)+'%';
 const kOk=KEY.every(i=>i.complete);if(kOk&&bg&&pr<.92)shown=Math.max(shown,.92);if((kOk&&bg&&performance.now()-t0>250)||performance.now()>8000){done=1;bar.style.width='100%';tx.textContent='마력을 모으는 중… 100%';bt.classList.add('out');setTimeout(()=>bt.remove(),400);return}setTimeout(tick,100)};tick()})();</script></body></html>
